description: 'Freeport Markets is a Y Combinator-backed fintech and crypto trading
  platform offering 24/7 self-custody access to stocks, crypto, commodities, forex,
  rates, perpetual futures and pre-IPO shares, with leverage and AI analysts that turn
  social and financial media into a real-time feed of market-moving news and actionable
  trade ideas. The consumer product is delivered primarily through iOS and Android
  apps and emphasizes self-custody, "smart money" signal tracking (insiders, politicians,
  hedge funds and social media), and unified DeFi opportunities in a single interface.
  This profile was surfaced as a Y Combinator portfolio company and enriched by the
  API Evangelist pipeline; Freeport Markets does not publish a public developer API,
  OpenAPI, SDKs, or developer documentation at this time.'
